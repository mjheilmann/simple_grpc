syntax = "proto3";

package maps;

import "google/protobuf/timestamp.proto";

service Mapper {
  rpc Echo(Holder) returns (Holder);
}

message Holder {
  map<string, Inner> by_name = 1;
  map<int32, Inner> by_id = 2;
  map<string, Mode> modes = 3;
  map<string, string> labels = 4;
  map<string, Deep> deep = 5;
  map<string, google.protobuf.Timestamp> times = 6;
}

message Inner {
  string v = 1;
}

message Deep {
  Inner inner = 1;
  map<string, Inner> more = 2;
  repeated Inner list = 3;
}

enum Mode {
  MODE_UNSPECIFIED = 0;
  FAST = 1;
  SLOW = 2;
}
