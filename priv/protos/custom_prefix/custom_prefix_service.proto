syntax = "proto3";

package custom_prefix;

// Simple service whose package ("custom_prefix") differs from its service name,
// to test that gRPC paths use the package prefix
service PrefixService {
  rpc Echo (EchoRequest) returns (EchoResponse) {}
}

message EchoRequest {
  string message = 1;
}

message EchoResponse {
  string reply = 1;
}